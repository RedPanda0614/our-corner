<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>斯婕 &amp; 真真 — Our Little Corner</title>
<meta name="theme-color" content="#839975">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Our Corner">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600&amp;display=swap">
<link rel="stylesheet" href="theme-vars.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="couple-corner" lang="en-US" aria-label="斯婕 &amp; 真真 — Our Little Corner">
  <div class="cc-top">
    <div class="cc-top-title"><span aria-hidden="true">✿</span><span>our little corner</span><span aria-hidden="true">/</span><span lang="zh-CN">斯婕 &amp; 真真</span></div>
    <div class="cc-top-actions"><button type="button" class="cc-bell" data-open-inbox="all" aria-label="Messages"><span aria-hidden="true">✉</span><b class="cc-count" data-bell-count hidden></b></button><span class="cc-sync" data-sync>…</span>
      <div class="cc-user" data-user>
        <button type="button" class="cc-user-btn" data-user-toggle aria-expanded="false" aria-label="Player card"><span data-user-icon></span></button>
        <div class="cc-user-pop cc-window cc-profile" role="dialog" aria-label="Player card">
          <div class="cc-bar"><span>PLAYER CARD</span></div>
          <div class="cc-body"><div data-player-card></div><button type="button" class="cc-button cc-logout" data-logout hidden>Log out</button></div>
        </div>
      </div>
    </div>
  </div>
  <div class="cc-browser-strip">
    <span class="cc-nav-buttons"><button type="button" class="cc-strip-btn" data-nav="back" aria-label="Back">←</button><button type="button" class="cc-strip-btn" data-nav="forward" aria-label="Forward">→</button><button type="button" class="cc-strip-btn" data-go="home" aria-label="Home">♡</button></span>
    <div class="cc-address"><b>Address</b> &nbsp; our.little.corner / <span data-current-folder>home</span></div>
    <span class="cc-strip-stars" aria-hidden="true">✧ ✿ ✧</span>
    <span class="cc-switches">
      <button type="button" class="cc-switch" data-mode-toggle="dark" aria-pressed="false" title="Light / dark"><svg class="cc-stick dark" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" shape-rendering="crispEdges"><rect class="st-base" x="3" y="17" width="18" height="5"/><rect class="st-base-top" x="3" y="16" width="18" height="2"/><g class="st-lever"><rect class="st-rod" x="11" y="7" width="2" height="10"/><rect class="st-ball" x="8" y="2" width="8" height="7"/><rect class="st-shine" x="9" y="3" width="2" height="2"/></g></svg><span data-mode-label="dark">LIGHT</span></button>
      <button type="button" class="cc-switch" data-mode-toggle="high" aria-pressed="false" title="Normal / high contrast"><svg class="cc-stick high" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" shape-rendering="crispEdges"><rect class="st-base" x="3" y="17" width="18" height="5"/><rect class="st-base-top" x="3" y="16" width="18" height="2"/><g class="st-lever"><rect class="st-rod" x="11" y="7" width="2" height="10"/><rect class="st-ball" x="8" y="2" width="8" height="7"/><rect class="st-shine" x="9" y="3" width="2" height="2"/></g></svg><span data-mode-label="high">NORMAL</span></button>
    </span>
  </div>

  <section class="cc-login" data-login hidden>
    <div class="cc-window cc-login-window">
      <div class="cc-bar"><span>♡ PRESS START</span></div>
      <div class="cc-body">
        <p class="cc-page-whisper" lang="zh-CN">只有我们两个能进来</p>
        <form data-login-form>
          <fieldset class="cc-who"><legend>Who are you?</legend>
            <label><input type="radio" name="who" value="sijie" checked><span class="cc-badge sijie">斯</span>斯婕</label>
            <label><input type="radio" name="who" value="zhenzhen"><span class="cc-badge zhenzhen">真</span>真真</label>
          </fieldset>
          <label class="cc-field">GitHub token<input name="token" type="password" autocomplete="current-password" required placeholder="github_pat_…" spellcheck="false"></label>
          <p class="cc-small">Only needed once on each device. It is kept in this browser.</p>
          <button type="submit" class="cc-button cc-login-go">START ▶</button>
          <p class="cc-import-error" data-login-error role="alert"></p>
        </form>
      </div>
    </div>
  </section>

  <div class="cc-grid" data-app>
    <aside class="cc-left">
      <section class="cc-tearpad" data-tearpad aria-label="How long we have been together"></section>
      <section class="cc-window cc-special-side" data-win="special"><div class="cc-bar"><span>♡ SPECIAL DAYS</span></div><div class="cc-body"><div data-upcoming-days></div><button type="button" class="cc-button cc-side-action" data-edit-days>Manage</button></div></section>
      <section class="cc-dock" data-dock aria-label="Music player dock">
        <div class="cc-dock-frame" data-dock-frame>
        <svg class="cc-cable" viewBox="0 0 180 60" width="180" height="60" aria-hidden="true" shape-rendering="crispEdges">
          <path class="cc-cable-edge" d="M-8 30 C -8 4, 31 -4, 31 16" fill="none"/><path class="cc-cable-line" d="M-8 30 C -8 4, 31 -4, 31 16" fill="none"/>
          <rect class="cc-plug" x="26" y="14" width="10" height="20"/>
          <rect class="cc-plug-ring" x="26" y="30" width="10" height="3"/>
          <rect class="cc-plug-tip" x="28.5" y="34" width="5" height="13"/>
        </svg>
        <span class="cc-dock-led" aria-hidden="true"></span>
        <div class="cc-ipod-body" data-ipod>
          <div class="cc-ipod-bubble" data-bgm-screen aria-live="polite"></div>
          <img class="cc-ipod-img" src="assets/ipod.png" alt="" draggable="false">
          <button type="button" class="cc-ipod-btn up" data-bgm="vol-up" aria-label="Volume up"></button>
          <button type="button" class="cc-ipod-btn down" data-bgm="vol-down" aria-label="Volume down"></button>
          <button type="button" class="cc-ipod-btn prev" data-bgm="prev" aria-label="Previous song"></button>
          <button type="button" class="cc-ipod-btn next" data-bgm="next" aria-label="Next song"></button>
          <button type="button" class="cc-ipod-btn play" data-bgm="toggle" aria-label="Play or pause"></button>
        </div>
        <p class="cc-dock-hint" data-dock-hint>drag me · 拖出来玩</p>
        </div>
      </section>
      <div class="cc-bunny-sticker" aria-hidden="true"></div>
    </aside>

    <main class="cc-center">
      <header class="cc-hero">
        <div class="cc-bar"><span>HOME</span></div>
        <div class="cc-hero-content">
          <div class="cc-intro">
            <div class="cc-label">OUR LITTLE CORNER</div>
            <h2 lang="zh-CN">斯婕 <em>&amp;</em> 真真</h2>
            <div class="cc-intro-tags" data-hero-stats></div>
          </div>
          <figure class="cc-game-scene"><div class="cc-game-art" role="img" aria-label="A white cat among sunflowers"></div><figcaption class="cc-game-caption" data-hero-caption></figcaption></figure>
        </div>
      </header>

      <nav class="cc-tabs" aria-label="Main navigation">
        <button class="cc-tab" data-go="home" aria-pressed="true"><span aria-hidden="true" class="cc-tab-ico">⌂</span><span>HOME</span><b class="cc-count cc-tab-count" data-tab-count="home" hidden></b></button>
        <button class="cc-tab" data-go="diary" aria-pressed="false"><span aria-hidden="true" class="cc-tab-ico">✎</span><span>DIARY</span><b class="cc-count cc-tab-count" data-tab-count="diary" hidden></b></button>
        <button class="cc-tab" data-go="todo" aria-pressed="false"><span aria-hidden="true" class="cc-tab-ico">✓</span><span>TODO</span><b class="cc-count cc-tab-count" data-tab-count="todo" hidden></b></button>
        <button class="cc-tab" data-go="wishlist" aria-pressed="false"><span aria-hidden="true" class="cc-tab-ico">♡</span><span>WISHLIST</span><b class="cc-count cc-tab-count" data-tab-count="wishlist" hidden></b></button>
        <button class="cc-tab" data-go="album" aria-pressed="false"><span aria-hidden="true" class="cc-tab-ico">▧</span><span>ALBUM</span><b class="cc-count cc-tab-count" data-tab-count="album" hidden></b></button>
      </nav>

      <div class="cc-inbox-pill-row" data-inbox-pill></div>
      <div class="cc-preview-message" id="cc-planner-message" role="status" aria-live="polite" hidden></div>

      <div data-panel="home" hidden>
        <section class="cc-window cc-memory-window cc-memory-strip" data-win="memory"><div class="cc-bar"><span>↺ RANDOM MEMORY</span></div><div class="cc-body" data-memory></div></section>
        <div data-home-calendar></div>
      </div>
      <div data-panel="diary" hidden></div>
      <div data-panel="album" hidden></div>
      <div data-panel="todo" class="cc-planner" hidden></div>
      <div data-panel="wishlist" class="cc-planner" hidden></div>

      <footer class="cc-foot"><span lang="zh-CN">斯婕 &amp; 真真</span><span data-foot-note></span></footer>
    </main>
  </div>
  <div class="cc-statusbar"><span data-status>READY</span><span lang="zh-CN">斯婕 + 真真 &nbsp;·&nbsp; 2P</span></div>

  <dialog class="cc-lightbox" data-lightbox aria-label="Photo"></dialog>
  <dialog class="cc-modal" data-special-dialog aria-label="Special days"></dialog>
  <dialog class="cc-modal cc-inbox" data-inbox aria-label="Messages"></dialog>
</div>

<script src="config.js"></script>
<script src="calendar-import.js"></script>
<script src="store.js"></script>
<script src="bgm.js"></script>
<script src="app.js"></script>
<script>
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(reg => reg.update()).catch(() => {});
  // When a new version takes over, reload once so the page uses the new files.
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadController && !window.__olcReloaded) { window.__olcReloaded = true; location.reload(); } });
}
</script>
</body>
</html>
